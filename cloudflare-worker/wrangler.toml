# Deploy config for the CORS proxy worker.
#
# `name` must stay exactly as the already-deployed worker is named, or a deploy creates a SECOND
# worker on a different URL and the app keeps talking to the old one. The app points at
# https://scoutsnf-cms-proxy.<subdomain>.workers.dev (see src/lib/corsProxy.ts), so `workers_dev`
# stays on to keep that hostname serving.
name = "scoutsnf-cms-proxy"
main = "cors-proxy.js"
compatibility_date = "2024-11-01"
workers_dev = true
